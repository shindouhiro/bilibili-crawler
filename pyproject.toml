[project]
name = "bilibili-crawler"
version = "0.1.0"
description = "Bilibili 视频搜索与下载工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.122.0",
  "httpx>=0.28.0",
  "pydantic>=2.12.0",
  "rich>=14.2.0",
  "typer>=0.20.0",
  "uvicorn[standard]>=0.38.0",
  "yt-dlp>=2025.12.8",
]

[project.scripts]
bilicrawl = "crawler.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
